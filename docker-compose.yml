# =============================================================================
# Docker Compose для ITMO EPLM Course
# =============================================================================
#
# Использование ClearML:
#   1. Создать .env файл на основе .env.example
#   2. Запустить эксперименты: docker-compose run --rm experiments
#   3. Запустить pipeline: docker-compose run --rm pipeline
#   4. Посмотреть результаты на https://app.clear.ml
#

services:
  # ---------------------------------------------------------------------------
  # Основной контейнер приложения
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: itmo-eplm-course:latest
    container_name: itmo-eplm-app
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      # ClearML credentials
      - CLEARML_API_ACCESS_KEY=${CLEARML_API_ACCESS_KEY}
      - CLEARML_API_SECRET_KEY=${CLEARML_API_SECRET_KEY}
      - CLEARML_API_HOST=${CLEARML_API_HOST:-https://api.clear.ml}
      - CLEARML_WEB_HOST=${CLEARML_WEB_HOST:-https://app.clear.ml}
      - CLEARML_FILES_HOST=${CLEARML_FILES_HOST:-https://files.clear.ml}
    volumes:
      # Монтирование данных и моделей для персистентности
      - ./data:/app/data
      - ./models:/app/models
      - ./notebooks:/app/notebooks
      - ./configs:/app/configs
    networks:
      - ml-network
    command: python main.py

  # ---------------------------------------------------------------------------
  # Jupyter Notebook сервер
  # ---------------------------------------------------------------------------
  jupyter:
    build:
      context: .
      dockerfile: Dockerfile
    image: itmo-eplm-course:latest
    container_name: itmo-eplm-jupyter
    restart: unless-stopped
    ports:
      - "8888:8888"
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - JUPYTER_ENABLE_LAB=yes
      # ClearML credentials
      - CLEARML_API_ACCESS_KEY=${CLEARML_API_ACCESS_KEY}
      - CLEARML_API_SECRET_KEY=${CLEARML_API_SECRET_KEY}
      - CLEARML_API_HOST=${CLEARML_API_HOST:-https://api.clear.ml}
      - CLEARML_WEB_HOST=${CLEARML_WEB_HOST:-https://app.clear.ml}
      - CLEARML_FILES_HOST=${CLEARML_FILES_HOST:-https://files.clear.ml}
    volumes:
      # Монтирование для работы с ноутбуками
      - ./notebooks:/app/notebooks
      - ./data:/app/data
      - ./models:/app/models
      - ./src:/app/src
      - ./configs:/app/configs
    networks:
      - ml-network
    command: >
      jupyter lab
      --ip=0.0.0.0
      --port=8888
      --no-browser
      --allow-root
      --NotebookApp.token=''
      --NotebookApp.password=''
      --notebook-dir=/app/notebooks

  # ---------------------------------------------------------------------------
  # Запуск всех экспериментов (18 конфигураций моделей)
  # ---------------------------------------------------------------------------
  experiments:
    build:
      context: .
      dockerfile: Dockerfile
    image: itmo-eplm-course:latest
    container_name: itmo-eplm-experiments
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      # ClearML credentials (обязательно!)
      - CLEARML_API_ACCESS_KEY=${CLEARML_API_ACCESS_KEY}
      - CLEARML_API_SECRET_KEY=${CLEARML_API_SECRET_KEY}
      - CLEARML_API_HOST=${CLEARML_API_HOST:-https://api.clear.ml}
      - CLEARML_WEB_HOST=${CLEARML_WEB_HOST:-https://app.clear.ml}
      - CLEARML_FILES_HOST=${CLEARML_FILES_HOST:-https://files.clear.ml}
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./configs:/app/configs
      - ./src:/app/src
    networks:
      - ml-network
    command: python -m src.experiments.run_experiments --models all

  # ---------------------------------------------------------------------------
  # ClearML Pipeline runner
  # ---------------------------------------------------------------------------
  pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    image: itmo-eplm-course:latest
    container_name: itmo-eplm-pipeline
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      # ClearML credentials (обязательно!)
      - CLEARML_API_ACCESS_KEY=${CLEARML_API_ACCESS_KEY}
      - CLEARML_API_SECRET_KEY=${CLEARML_API_SECRET_KEY}
      - CLEARML_API_HOST=${CLEARML_API_HOST:-https://api.clear.ml}
      - CLEARML_WEB_HOST=${CLEARML_WEB_HOST:-https://app.clear.ml}
      - CLEARML_FILES_HOST=${CLEARML_FILES_HOST:-https://files.clear.ml}
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./configs:/app/configs
      - ./src:/app/src
    networks:
      - ml-network
    command: python -m src.pipelines.clearml_pipeline --local

  # ---------------------------------------------------------------------------
  # Обучение одной модели (можно указать конфигурацию)
  # Пример: docker-compose run --rm train random_forest_large
  # ---------------------------------------------------------------------------
  train:
    build:
      context: .
      dockerfile: Dockerfile
    image: itmo-eplm-course:latest
    container_name: itmo-eplm-train
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      # ClearML credentials
      - CLEARML_API_ACCESS_KEY=${CLEARML_API_ACCESS_KEY}
      - CLEARML_API_SECRET_KEY=${CLEARML_API_SECRET_KEY}
      - CLEARML_API_HOST=${CLEARML_API_HOST:-https://api.clear.ml}
      - CLEARML_WEB_HOST=${CLEARML_WEB_HOST:-https://app.clear.ml}
      - CLEARML_FILES_HOST=${CLEARML_FILES_HOST:-https://files.clear.ml}
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./configs:/app/configs
      - ./src:/app/src
    networks:
      - ml-network
    entrypoint: ["python", "src/models/train_model.py"]
    command: ["random_forest_medium"]

  # ---------------------------------------------------------------------------
  # DVC Pipeline (подготовка данных через DVC)
  # ---------------------------------------------------------------------------
  dvc:
    build:
      context: .
      dockerfile: Dockerfile
    image: itmo-eplm-course:latest
    container_name: itmo-eplm-dvc
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./configs:/app/configs
      - ./src:/app/src
      - ./.dvc:/app/.dvc
      - ./.git:/app/.git:ro
      - ./dvc.yaml:/app/dvc.yaml:ro
      - ./dvc.lock:/app/dvc.lock
    networks:
      - ml-network
    command: dvc repro

  # ---------------------------------------------------------------------------
  # Model Registry CLI
  # ---------------------------------------------------------------------------
  registry:
    build:
      context: .
      dockerfile: Dockerfile
    image: itmo-eplm-course:latest
    container_name: itmo-eplm-registry
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      # ClearML credentials
      - CLEARML_API_ACCESS_KEY=${CLEARML_API_ACCESS_KEY}
      - CLEARML_API_SECRET_KEY=${CLEARML_API_SECRET_KEY}
      - CLEARML_API_HOST=${CLEARML_API_HOST:-https://api.clear.ml}
      - CLEARML_WEB_HOST=${CLEARML_WEB_HOST:-https://app.clear.ml}
      - CLEARML_FILES_HOST=${CLEARML_FILES_HOST:-https://files.clear.ml}
    volumes:
      - ./src:/app/src
    networks:
      - ml-network
    entrypoint: ["python", "-m", "src.models.model_registry"]
    command: ["list-models"]

# -----------------------------------------------------------------------------
# Networks
# -----------------------------------------------------------------------------
networks:
  ml-network:
    driver: bridge
    name: itmo-eplm-network

# -----------------------------------------------------------------------------
# Volumes (опционально, если нужна персистентность между пересборками)
# -----------------------------------------------------------------------------
volumes:
  data:
    name: itmo-eplm-data
  models:
    name: itmo-eplm-models
