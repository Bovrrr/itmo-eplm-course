# Logistic Regression with ElasticNet regularization
model_class: LogisticRegression
description: "Logistic Regression with ElasticNet (l1_ratio=0.5)"

# From base/linear_models.yaml
random_state: ${random_state}

# Model-specific
penalty: elasticnet
C: 1.0
solver: saga
l1_ratio: 0.5
max_iter: 2000
