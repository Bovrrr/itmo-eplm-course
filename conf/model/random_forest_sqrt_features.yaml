# Random Forest with sqrt max_features
model_class: RandomForestClassifier
description: "Random Forest with sqrt max_features"

# From base/tree_models.yaml
random_state: ${random_state}
n_jobs: -1
min_samples_split: 2
min_samples_leaf: 1

# Model-specific
n_estimators: 100
max_depth: 10
max_features: sqrt
